<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Editor Mobile - Formas, Ícones e Texto</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
      background: #1e293b; 
      color: #f8fafc; 
      padding: 10px;
    }
    
    .container { max-width: 100%; margin: 0 auto; }
    
    .canvas-section {
      background: #0f172a;
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    
    .canvas-wrap { 
      width: 100%; 
      max-height: 40vh; 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      background: #334155;
      border-radius: 8px;
    }
    
    canvas { 
      max-width: 100%; 
      max-height: 40vh; 
      object-fit: contain; 
      display: block; 
    }

    .controls-section {
      background: #334155;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    .field { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    
    label { font-size: 11px; font-weight: bold; color: #cbd5e1; text-transform: uppercase; }
    
    select, input[type="color"], input[type="range"], input[type="text"], button {
      width: 100%; 
      border: 1px solid #475569; 
      border-radius: 8px; 
      padding: 8px; 
      font-size: 14px; 
      background: #1e293b; 
      color: #fff;
      height: 40px;
    }
    input[type="range"] { padding: 0; background: transparent; }
    input[type="text"]::placeholder { color: #64748b; }
    
    .chips-container { margin: 10px 0; }
    .chips-label { font-size: 11px; font-weight: bold; color: #cbd5e1; margin-bottom: 4px; display: block;}
    .chips { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 6px; 
      padding: 8px; 
      background: #1e293b; 
      border-radius: 8px; 
      min-height: 44px;
      border: 1px solid #475569;
    }
    .chip { 
      padding: 6px 12px; 
      border-radius: 20px; 
      border: 1px solid #3b82f6; 
      background: #1d4ed8; 
      color: #fff;
      cursor: pointer; 
      font-size: 12px; 
      font-weight: bold;
    }
    .chip.selected {
      background: #22c55e;
      border-color: #4ade80;
      box-shadow: 0 0 8px #22c55e;
    }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    button { border: none; cursor: pointer; font-weight: bold; background: #3b82f6; transition: background 0.2s;}
    button:active { filter: brightness(0.8); }
    
    button.btn-add { background: #2563eb; }
    button.btn-stamp { background: #16a34a; grid-column: span 2; height: 46px; font-size: 16px; }
    button.btn-danger { background: #dc2626; }
    button.btn-save { background: #059669; }
    button.btn-clear { background: #4b5563; }

    .hint { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. ÁREA DO CANVAS -->
    <div class="canvas-section">
      <div class="canvas-wrap">
        <canvas id="editorCanvas"></canvas>
      </div>
      <div class="hint">Toque na foto para posicionar o item selecionado.</div>
    </div>

    <!-- 2. CONTROLES DO APLICATIVO -->
    <div class="controls-section">
      
      <div class="row">
        <div class="field">
          <label>1. Selecione a Foto de Fundo</label>
          <input type="file" id="imgInput" accept="image/*" style="padding: 5px; height: auto;">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="shapeType">Forma / Tipo</label>
          <select id="shapeType">
            <option value="rectangle">🟩 Retângulo</option>
            <option value="circle">🔵 Círculo</option>
            <option value="triangle">🔺 Triângulo</option>
            <option value="star">⭐ Estrela</option>
            <option value="heart">❤️ Coração</option>
            <option value="balloon">💬 Balão de Fala</option>
            <option value="text">📝 Texto Puro</option>
          </select>
        </div>
        <div class="field" id="styleField">
          <label for="fillMode">Estilo</label>
          <select id="fillMode">
            <option value="fill">Preenchido</option>
            <option value="stroke">Transparente</option>
          </select>
        </div>
        <div class="field">
          <label for="shapeColor">Cor</label>
          <input type="color" id="shapeColor" value="#3b82f6">
        </div>
      </div>

      <!-- CAMPO DE TEXTO DINÂMICO (Ativo para texto e balão) -->
      <div class="row" id="textFieldRow" style="display: none;">
        <div class="field">
          <label for="shapeText">Texto da Camada</label>
          <input type="text" id="shapeText" value="Olá!" placeholder="Digite o texto aqui...">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label id="labelW" for="sizeW">Largura</label>
          <input type="range" id="sizeW" min="20" max="400" value="130">
        </div>
        <div class="field" id="heightField">
          <label for="sizeH">Altura</label>
          <input type="range" id="sizeH" min="20" max="400" value="130">
        </div>
        <div class="field">
          <label for="rotate">Rotação</label>
          <input type="range" id="rotate" min="0" max="360" value="0">
        </div>
      </div>

      <!-- LISTA DE CAMADAS (CHIPS) -->
      <div class="chips-container">
        <span class="chips-label">Camadas Ativas (Clique para selecionar):</span>
        <div class="chips" id="layersList"></div>
      </div>

      <!-- BOTÕES DE AÇÃO -->
      <div class="actions">
        <button class="btn-add" id="addLayerBtn">➕ Nova Camada</button>
        <button class="btn-danger" id="deleteLayerBtn">🗑️ Excluir Camada</button>
        <button class="btn-stamp" id="stampLayerBtn">📌 CARIMBAR NA FOTO</button>
        <button class="btn-clear" id="clearAllBtn">Limpar Tudo</button>
        <button class="btn-save" id="savePhotoBtn">💾 Salvar Foto</button>
      </div>

    </div>
  </div>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');

    const imgInput = document.getElementById('imgInput');
    const shapeType = document.getElementById('shapeType');
    const fillMode = document.getElementById('fillMode');
    const shapeColor = document.getElementById('shapeColor');
    const shapeText = document.getElementById('shapeText');
    const sizeW = document.getElementById('sizeW');
    const sizeH = document.getElementById('sizeH');
    const rotate = document.getElementById('rotate');
    const layersList = document.getElementById('layersList');
    
    const textFieldRow = document.getElementById('textFieldRow');
    const heightField = document.getElementById('heightField');
    const styleField = document.getElementById('styleField');
    const labelW = document.getElementById('labelW');

    let canvasWidth = 800;
    let canvasHeight = 800;
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    let layers = [];
    let selectedIndex = -1;
    let nextId = 1;
    let loadedBgImage = null;

    const baseCanvas = document.createElement('canvas');
    const baseCtx = baseCanvas.getContext('2d');
    baseCanvas.width = canvasWidth;
    baseCanvas.height = canvasHeight;

    clearBaseCanvas();
    addNewLayer('rectangle');

    function clearBaseCanvas() {
      baseCtx.fillStyle = '#475569';
      baseCtx.fillRect(0, 0, baseCanvas.width, baseCanvas.height);
    }

    // CARREGAR FOTO
    imgInput.addEventListener('change', function(e) {
      if (!e.target.files[0]) return;
      const blobUrl = URL.createObjectURL(e.target.files[0]);
      
      loadedBgImage = new Image();
      loadedBgImage.onload = function() {
        let ratio = loadedBgImage.width / loadedBgImage.height;
        let w = baseCanvas.width;
        let h = baseCanvas.width / ratio;
        
        if (h > baseCanvas.height) {
          h = baseCanvas.height;
          w = h * ratio;
        }
        
        let x = (baseCanvas.width - w) / 2;
        let y = (baseCanvas.height - h) / 2;

        baseCtx.fillStyle = '#1e293b';
        baseCtx.fillRect(0, 0, baseCanvas.width, baseCanvas.height);
        baseCtx.drawImage(loadedBgImage, x, y, w, h);
        
        URL.revokeObjectURL(blobUrl);
        render();
      };
      loadedBgImage.src = blobUrl;
    });

    // ADICIONAR CAMADA
    function addNewLayer(type) {
      const currentType = type || shapeType.value;
      const layer = {
        id: nextId++,
        type: currentType,
        mode: fillMode.value,
        color: shapeColor.value,
        x: canvasWidth / 2,
        y: canvasHeight / 2,
        w: currentType === 'text' ? 50 : Number(sizeW.value), 
        h: Number(sizeH.value),
        angle: Number(rotate.value),
        text: shapeText.value || 'Texto'
      };
      layers.push(layer);
      selectedIndex = layers.length - 1;
      syncControls();
      render();
    }

    function renderLayersChips() {
      layersList.innerHTML = '';
      if(layers.length === 0) {
        layersList.innerHTML = '<span style="color:#64748b; font-size:12px; padding:8px;">Nenhuma camada ativa</span>';
        return;
      }

      layers.forEach((layer, index) => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (index === selectedIndex ? ' selected' : '');
        
        let icon = '🟩';
        if (layer.type === 'circle') icon = '🔵';
        if (layer.type === 'triangle') icon = '🔺';
        if (layer.type === 'star') icon = '⭐';
        if (layer.type === 'heart') icon = '❤️';
        if (layer.type === 'balloon') icon = '💬';
        if (layer.type === 'text') icon = '📝';
        
        chip.textContent = `${icon} item ${layer.id}`;
        
        chip.onclick = function() {
          selectedIndex = index;
          syncControls();
          render();
        };
        layersList.appendChild(chip);
      });
    }

    // MOTOR DE RENDERIZAÇÃO GEOMÉTRICA E VETORIAL
    function drawShape(targetCtx, l, isSelected) {
      targetCtx.save();
      targetCtx.translate(l.x, l.y);
      targetCtx.rotate(l.angle * Math.PI / 180);

      targetCtx.fillStyle = l.color;
      targetCtx.strokeStyle = l.color;
      targetCtx.lineWidth = 6;
      targetCtx.lineJoin = "round";

      if (l.type === 'text') {
        targetCtx.font = `bold ${l.w}px Arial`; 
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(l.text, 0, 0);
        
        if (isSelected) {
          const metrics = targetCtx.measureText(l.text);
          targetCtx.strokeStyle = '#22c55e';
          targetCtx.lineWidth = 4;
          targetCtx.setLineDash([6, 4]);
          targetCtx.strokeRect(-metrics.width / 2 - 12, -l.w / 2 - 12, metrics.width + 24, l.w + 24);
        }
      } else {
        targetCtx.beginPath();
        
        if (l.type === 'rectangle') {
          targetCtx.rect(-l.w / 2, -l.h / 2, l.w, l.h);
        } 
        else if (l.type === 'circle') {
          targetCtx.arc(0, 0, Math.min(l.w, l.h) / 2, 0, Math.PI * 2);
        } 
        else if (l.type === 'triangle') {
          targetCtx.moveTo(0, -l.h / 2);
          targetCtx.lineTo(l.w / 2, l.h / 2);
          targetCtx.lineTo(-l.w / 2, l.h / 2);
          targetCtx.closePath();
        } 
        else if (l.type === 'star') {
          // Lógica adaptada para renderizar estrela simétrica de 5 pontas[cite: 1]
          const spikes = 5;
          const outerRadius = Math.min(l.w, l.h) / 2;
          const innerRadius = outerRadius * 0.4;
          let rot = Math.PI / 2 * 3;
          let cx = 0, cy = 0;
          let step = Math.PI / spikes;

          targetCtx.moveTo(0, -outerRadius);
          for (let i = 0; i < spikes; i++) {
            cx = Math.cos(rot) * outerRadius;
            cy = Math.sin(rot) * outerRadius;
            targetCtx.lineTo(cx, cy);
            rot += step;

            cx = Math.cos(rot) * innerRadius;
            cy = Math.sin(rot) * innerRadius;
            targetCtx.lineTo(cx, cy);
            rot += step;
          }
          targetCtx.closePath();
        } 
        else if (l.type === 'heart') {
          // Curvas matemáticas de Bézier para desenhar o coração centralizado
          let topY = -l.h * 0.35;
          targetCtx.moveTo(0, l.h / 2); 
          // Lado esquerdo do coração
          targetCtx.bezierCurveTo(-l.w * 0.6, l.h * 0.1, -l.w * 0.6, topY, -l.w * 0.25, topY);
          targetCtx.bezierCurveTo(0, topY, 0, -l.h * 0.1, 0, -l.h * 0.1);
          // Lado direito do coração
          targetCtx.bezierCurveTo(0, -l.h * 0.1, 0, topY, l.w * 0.25, topY);
          targetCtx.bezierCurveTo(l.w * 0.6, topY, l.w * 0.6, l.h * 0.1, 0, l.h / 2);
          targetCtx.closePath();
        } 
        else if (l.type === 'balloon') {
          // Desenha a elipse/caixa superior do balão
          let rW = l.w / 2;
          let rH = l.h * 0.35;
          targetCtx.oval = targetCtx.ellipse || function(x, y, rx, ry, rot, sa, ea) {
            this.arc(x, y, rx, sa, ea); // Fallback simples para compatibilidade
          };
          targetCtx.ellipse(0, -l.h*0.1, rW, rH, 0, 0, Math.PI * 2);
          // Desenha a "ponta/indicador" de fala embaixo
          targetCtx.moveTo(-rW * 0.2, rH - l.h*0.1);
          targetCtx.lineTo(-rW * 0.3, l.h / 2);
          targetCtx.lineTo(rW * 0.1, rH - l.h*0.1);
          targetCtx.closePath();
        }

        if (l.mode === 'fill') targetCtx.fill();
        targetCtx.stroke();

        // Se for um balão, renderiza o texto de forma automática centralizado dentro dele
        if (l.type === 'balloon' && l.text) {
          targetCtx.fillStyle = l.mode === 'fill' ? '#ffffff' : l.color; // Altera cor para contraste
          if(l.color === '#ffffff' && l.mode === 'fill') targetCtx.fillStyle = '#000000';
          
          targetCtx.font = `bold ${Math.min(l.w * 0.15, l.h * 0.13)}px Arial`;
          targetCtx.textAlign = 'center';
          targetCtx.textBaseline = 'middle';
          targetCtx.fillText(l.text, 0, -l.h*0.1);
        }

        if (isSelected) {
          targetCtx.strokeStyle = '#22c55e';
          targetCtx.lineWidth = 4;
          targetCtx.setLineDash([6, 4]);
          targetCtx.strokeRect(-l.w / 2 - 12, -l.h / 2 - 12, l.w + 24, l.h + 24);
        }
      }

      targetCtx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(baseCanvas, 0, 0);
      layers.forEach((layer, index) => {
        drawShape(ctx, layer, index === selectedIndex);
      });
      renderLayersChips();
    }

    function syncControls() {
      if (selectedIndex < 0 || !layers[selectedIndex]) return;
      const l = layers[selectedIndex];
      shapeType.value = l.type;
      fillMode.value = l.mode;
      shapeColor.value = l.color;
      sizeW.value = l.w;
      sizeH.value = l.h;
      rotate.value = l.angle;
      shapeText.value = l.text;

      // Habilita campo de texto apenas se for Texto Puro ou Balão de fala
      if (l.type === 'text' || l.type === 'balloon') {
        textFieldRow.style.display = 'flex';
      } else {
        textFieldRow.style.display = 'none';
      }

      if (l.type === 'text') {
        heightField.style.display = 'none';
        styleField.style.display = 'none';
        labelW.textContent = "Tamanho da Fonte";
        sizeW.min = "16"; sizeW.max = "200";
      } else {
        heightField.style.display = 'flex';
        styleField.style.display = 'flex';
        labelW.textContent = "Largura";
        sizeW.min = "20"; sizeW.max = "500";
      }
    }

    function updateSelectedLayer() {
      if (selectedIndex >= 0 && layers[selectedIndex]) {
        let l = layers[selectedIndex];
        l.type = shapeType.value;
        l.mode = fillMode.value;
        l.color = shapeColor.value;
        l.w = Number(sizeW.value);
        l.h = Number(sizeH.value);
        l.angle = Number(rotate.value);
        l.text = shapeText.value;
        render();
      }
    }

    sizeW.addEventListener('input', updateSelectedLayer);
    sizeH.addEventListener('input', updateSelectedLayer);
    rotate.addEventListener('input', updateSelectedLayer);
    shapeColor.addEventListener('input', updateSelectedLayer);
    fillMode.addEventListener('change', updateSelectedLayer);
    shapeText.addEventListener('input', updateSelectedLayer);
    
    shapeType.addEventListener('change', () => {
      if (selectedIndex >= 0 && layers[selectedIndex]) {
        layers[selectedIndex].type = shapeType.value;
        if (shapeType.value === 'text') layers[selectedIndex].w = 50; 
        syncControls();
        updateSelectedLayer();
      }
    });

    // CLIQUE/TOQUE MÓVEL PARA MOVER
    function handlePointer(e) {
      if (selectedIndex < 0 || !layers[selectedIndex]) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const touchX = (clientX - rect.left) * (canvas.width / rect.width);
      const touchY = (clientY - rect.top) * (canvas.height / rect.height);
      
      layers[selectedIndex].x = touchX;
      layers[selectedIndex].y = touchY;
      render();
    }

    canvas.addEventListener('touchstart', function(e) { e.preventDefault(); handlePointer(e); }, {passive: false});
    canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handlePointer(e); }, {passive: false});
    canvas.addEventListener('mousedown', handlePointer);

    // AÇÕES DOS BOTÕES
    document.getElementById('addLayerBtn').onclick = () => addNewLayer();
    
    document.getElementById('deleteLayerBtn').onclick = () => {
      if (selectedIndex >= 0) {
        layers.splice(selectedIndex, 1);
        selectedIndex = layers.length - 1;
        syncControls();
        render();
      }
    };

    // BOTÃO CARIMBAR
    document.getElementById('stampLayerBtn').onclick = () => {
      if (selectedIndex < 0 || !layers[selectedIndex]) {
        alert("Crie ou selecione uma camada primeiro!");
        return;
      }
      drawShape(baseCtx, layers[selectedIndex], false);
      layers.splice(selectedIndex, 1);
      selectedIndex = layers.length - 1;
      
      syncControls();
      render();
    };

    document.getElementById('clearAllBtn').onclick = () => {
      layers = [];
      selectedIndex = -1;
      clearBaseCanvas();
      render();
    };

    document.getElementById('savePhotoBtn').onclick = () => {
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      const link = document.createElement('a');
      link.download = 'foto_editada_completa.jpg';
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    render();
  </script>
</body>
</html>
